<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fighter Plane</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d18;color:#eaf2ff;font-family:system-ui,Arial;overflow:hidden}#game{display:block;width:100vw;height:100vh;touch-action:none;background:radial-gradient(circle at 50% 35%,#182d45,#070d18 70%)}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000}.panel{background:#0d1727cc;border:1px solid #35516d;border-radius:10px;padding:7px 10px}.bar{width:110px;height:7px;background:#263346;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#53e3a6;width:100%}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#070d18e8}#menu .box{width:min(90vw,420px);padding:24px;border:1px solid #35516d;border-radius:18px;background:#0c1727;text-align:center}h1{margin:0 0 6px;letter-spacing:2px}p{color:#a9bdd2}button{border:0;border-radius:10px;padding:13px 18px;margin:5px;background:#2c8cff;color:white;font-weight:700;font-size:16px}button.secondary{background:#24354a}#controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;opacity:.82;border:1px solid #64809c;background:#15283d;font-size:14px;padding:15px;border-radius:50%;width:62px;height:62px}#controls .fire{background:#8d2f42}#tip{font-size:12px;color:#8fa7be;margin-top:12px}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel">HP<div class="bar"><div id="hp" class="fill"></div></div></div><div class="panel">Score: <b id="score">0</b><br>Enemies: <b id="enemies">0</b></div><div class="panel">Wave <b id="wave">1</b></div></div><div id="controls"><div><button id="left">◀</button><button id="right">▶</button></div><div><button id="boost">BOOST</button><button id="fire" class="fire">FIRE</button></div></div><div id="menu"><div class="box"><h1>FIGHTER PLANE</h1><p>Arcade air combat — mobile edition</p><button id="start">START MISSION</button><button id="help" class="secondary">CONTROLS</button><div id="tip">Drag/tap to aim • FIRE to shoot • BOOST to dash</div></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,playing=false,score=0,wave=1,last=0,spawn=0,fireHeld=false,keys={},touch={x:0,y:0,active:false};const p={x:0,y:0,a:-Math.PI/2,s:220,hp:100,boost:0,cd:0};let bullets=[],enemies=[],particles=[];
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;if(!p.x){p.x=W/2;p.y=H*.75}}addEventListener('resize',resize);resize();
function reset(){score=0;wave=1;p.x=W/2;p.y=H*.75;p.hp=100;p.boost=0;p.cd=0;bullets=[];enemies=[];particles=[];spawn=0;playing=true;document.getElementById('menu').style.display='none'}
function shoot(){if(!playing||p.cd>0)return;p.cd=.18;bullets.push({x:p.x+Math.cos(p.a)*22,y:p.y+Math.sin(p.a)*22,a:p.a,s:600,life:1})}
function addEnemy(){let side=Math.random()*W;enemies.push({x:side,y:-30,a:Math.PI/2,s:45+wave*5,hp:2,cd:Math.random()*2})}
function boom(q){for(let i=0;i<12;i++)particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.5})}
function update(dt){if(!playing)return;p.cd-=dt;p.boost=Math.max(0,p.boost-dt);let turn=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);p.a+=turn*3*dt;if(touch.active)p.a=Math.atan2(touch.y-p.y,touch.x-p.x);let speed=p.s*(p.boost>0?2:1);if(keys.w||keys.ArrowUp)p.x+=Math.cos(p.a)*speed*dt,p.y+=Math.sin(p.a)*speed*dt;if(keys.s||keys.ArrowDown)p.x-=Math.cos(p.a)*speed*.45*dt,p.y-=Math.sin(p.a)*speed*.45*dt;p.x=Math.max(22,Math.min(W-22,p.x));p.y=Math.max(22,Math.min(H-22,p.y));if(fireHeld)shoot();spawn-=dt;if(spawn<=0){addEnemy();spawn=Math.max(.35,1.3-wave*.06)}for(const b of bullets){b.x+=Math.cos(b.a)*b.s*dt;b.y+=Math.sin(b.a)*b.s*dt;b.life-=dt}bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);for(const e of enemies){e.y+=e.s*dt;e.a=Math.atan2(p.y-e.y,p.x-e.x);e.cd-=dt;if(e.cd<0){e.cd=1.5;/* readable enemy pressure */}if(Math.hypot(e.x-p.x,e.y-p.y)<25){p.hp-=22*dt;}}for(const b of bullets)for(const e of enemies)if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<20){e.hp--;b.life=0;if(e.hp<=0){e.dead=true;score+=100;boom(e)}}enemies=enemies.filter(e=>!e.dead&&e.y<H+50);if(p.hp<=0){playing=false;document.getElementById('menu').style.display='grid';document.querySelector('#menu p').textContent='Mission failed. Score: '+score;document.getElementById('start').textContent='RESTART'}if(score>=wave*1000)wave++;for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);document.getElementById('hp').style.width=Math.max(0,p.hp)+'%';document.getElementById('score').textContent=score;document.getElementById('enemies').textContent=enemies.length;document.getElementById('wave').textContent=wave}
function draw(){x.clearRect(0,0,W,H);x.strokeStyle='#173047';x.lineWidth=1;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=48){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}for(const q of particles){x.globalAlpha=q.life*2;x.fillStyle='#ffb454';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}x.globalAlpha=1;for(const b of bullets){x.fillStyle='#7de8ff';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}for(const e of enemies){x.save();x.translate(e.x,e.y);x.rotate(e.a);x.fillStyle='#e75c6b';x.beginPath();x.moveTo(20,0);x.lineTo(-16,-12);x.lineTo(-8,0);x.lineTo(-16,12);x.closePath();x.fill();x.restore()}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#62e6b2';x.beginPath();x.moveTo(25,0);x.lineTo(-17,-13);x.lineTo(-7,0);x.lineTo(-17,13);x.closePath();x.fill();x.fillStyle='#d8fff1';x.fillRect(-8,-3,12,6);x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')fireHeld=true;if(e.key==='Shift')p.boost=.5});addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')fireHeld=false});document.getElementById('start').onclick=reset;document.getElementById('help').onclick=()=>alert('Desktop: WASD / arrows to move, mouse direction, Space to fire, Shift to boost. Mobile: drag on the arena to aim, use FIRE and BOOST.');for(const id of ['left','right']){document.getElementById(id).ontouchstart=e=>{keys[id==='left'?'a':'d']=true};document.getElementById(id).ontouchend=e=>{keys[id==='left'?'a':'d']=false}}document.getElementById('fire').ontouchstart=()=>fireHeld=true;document.getElementById('fire').ontouchend=()=>fireHeld=false;document.getElementById('boost').ontouchstart=()=>p.boost=.5;c.addEventListener('pointerdown',e=>{touch.active=true;touch.x=e.clientX;touch.y=e.clientY});c.addEventListener('pointermove',e=>{if(touch.active){touch.x=e.clientX;touch.y=e.clientY}});addEventListener('pointerup',()=>touch.active=false);
</script></body></html>
